[project]
name = "promohunt-be"
version = "1.0.0"
description = "PromoHunt API — descuentos de videojuegos (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "pyjwt>=2.9",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/W pycodestyle · F pyflakes · I imports · B bugbear · UP pyupgrade · S bandit (seguridad)
select = ["E", "W", "F", "I", "B", "UP", "S"]
ignore = ["S608"]  # SQL dinámico: nombres de columna salen de modelos Pydantic fijos (ver routers/admin.py)

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["S101", "S105", "S106"]  # assert y contraseñas de prueba son normales en tests
"app/config.py" = ["S105"]                # valor por defecto de desarrollo (validado en producción)

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-q"
