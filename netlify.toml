# Netlify — el frontend vive en la subcarpeta fe/ (no hay package.json en la raíz)
[build]
  base    = "fe"
  command = "npm ci && npm run build"
  publish = "dist"            # relativo a "base" => fe/dist

[build.environment]
  NODE_VERSION = "22"         # Vite 8 exige Node >= 20.19; el Node por defecto de Netlify puede ser menor

# --- API ---------------------------------------------------------------
# El backend (FastAPI + PostgreSQL) NO se ejecuta en Netlify: hay que alojarlo aparte
# (Render, Railway, Fly.io, un VPS con docker-compose.prod.yml...).
# Cuando tengas su URL pública, descomenta y reemplaza TU-BACKEND:
#
# [[redirects]]
#   from   = "/api/*"
#   to     = "https://TU-BACKEND.onrender.com/api/:splat"
#   status = 200
#   force  = true
#
# (Esta regla debe ir ANTES de la regla SPA de abajo.)

# --- SPA: las rutas del cliente (/admin, /Perfil, /juego/8...) devuelven index.html ---
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
