services:
  db:
    image: postgres:17-alpine
    container_name: promohunt_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: promohunt
      POSTGRES_PASSWORD: promohunt
      POSTGRES_DB: descuentos_juegos
    ports:
      - "5432:5432"
    volumes:
      - promohunt_data:/var/lib/postgresql/data
      - ./be/descuentos_juegos_postgres.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promohunt -d descuentos_juegos"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  promohunt_data:
