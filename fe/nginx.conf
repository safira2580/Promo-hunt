# Sirve el frontend estático y hace proxy de /api hacia el backend (mismo origen => sin CORS)
upstream promohunt_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- compresión ---
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 500;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- cabeceras de seguridad ---
    # OJO: en nginx un add_header dentro de un location ANULA los heredados del server,
    # por eso se repiten en los location que definen sus propios add_header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

    # --- API ---
    location /api/ {
        proxy_pass http://promohunt_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location = /health { proxy_pass http://promohunt_api; }

    # --- assets con hash en el nombre: caché de 1 año ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # --- SPA: cualquier ruta del cliente devuelve index.html (sin caché) ---
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
