name: CI
on:
  push: { branches: [main, develop] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: promohunt, POSTGRES_PASSWORD: promohunt, POSTGRES_DB: descuentos_juegos_test }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U promohunt" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults: { run: { working-directory: be } }
    env:
      TEST_DATABASE_URL: postgresql://promohunt:promohunt@localhost:5433/descuentos_juegos_test
      SECRET_KEY: ci-secret-key-minimo-32-caracteres-xxxxxxxx
      BCRYPT_ROUNDS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff — incluye reglas de seguridad S)
        run: ruff check app && ruff format --check app
      - name: Pruebas + cobertura mínima 85 %
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85
      - name: Auditoría de dependencias
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: fe } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: fe/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
